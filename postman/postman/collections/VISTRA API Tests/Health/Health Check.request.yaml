$kind: http-request
url: "{{base_url}}/api/health/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Health check returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    });\r

      \r

      pm.test(\"API reports running\", function () {\r

      \    const json = pm.response.json();\r

      \r

      \    pm.expect(json.success).to.eql(true);\r

      \    pm.expect(json).to.have.property(\"message\");\r

      \    });"
    language: text/javascript
order: 100
