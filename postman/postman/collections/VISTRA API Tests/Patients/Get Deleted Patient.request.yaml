$kind: http-request
url: "{{base_url}}/patients/{{patient_id}}/"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Deleted patient reports failure\", function () {\r

      \    pm.response.to.have.status(200);\r

      \r

      \    const json = pm.response.json();\r

      \r

      \    pm.expect(json.success).to.eql(false);\r

      \    pm.expect(json).to.have.property(\"message\");\r

      \    });"
    language: text/javascript
order: 9900
